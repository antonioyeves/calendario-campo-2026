ackground:transparent;color:inherit;cursor:pointer}.link-btn{text-decoration:underline;color:var(--vine2)}.grid-wrap{border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);overflow:auto;max-height:74vh;margin-top:10px}table.cal{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}table.cal th,table.cal td{border-bottom:1px solid var(--line);border-left:1px solid var(--line)}table.cal thead th{position:sticky;top:0;z-index:4;background:var(--paper2);padding:7px 10px;text-align:left;font-weight:500}table.cal thead tr.detail th{top:27px;background:var(--card);min-width:190px;max-width:190px}table.cal thead th.corner,table.cal tbody th{position:sticky;left:0;z-index:6}table.cal tbody th{background:var(--card);border-left:0;padding:8px 10px;min-width:126px;text-align:left;font-size:12px}.dow{display:block;color:var(--soft);font-size:10px}.pname{display:block;font-size:13px}.pline{display:block;color:var(--soft);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pline.proy{color:var(--vine2);font-weight:600}.bar{height:3px;display:block;margin-bottom:5px}.weekend td,.weekend th{background:var(--weekend)!important}.today td,.today th{background:var(--today)!important}td{min-width:190px;max-width:190px;height:54px;padding:0}.vac-th,.vac-td{min-width:125px!important;max-width:125px!important}.cell-btn{width:100%;height:100%;min-height:54px;border:0;background:transparent;text-align:left;padding:6px 9px;color:var(--ink);cursor:pointer}.cell-btn:hover{background:rgba(59,90,68,.08)}.desc{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.tag{font-size:9.5px;padding:2px 5px;border-radius:999px;background:var(--vine);color:white}.tag.veh{background:var(--clay)}.tag.realizada{background:var(--green)}.tag.cancelada{background:var(--red)}.tag.aproximada{background:var(--blue)}.tag.vac{background:var(--amber);color:#2A2109}.plus{color:var(--soft);opacity:.45}.overlay{position:fixed;inset:0;background:rgba(20,19,14,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:6px}.modal.wide{max-width:800px}.modal-head,.modal-foot{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.modal-foot{border-top:1px solid var(--line);border-bottom:0}.modal-body{padding:17px 20px}.modal h2{font-family:"Fraunces";font-weight:500;margin:0;font-size:20px}.modal-close{border:0;background:transparent;font-size:20px;cursor:pointer}.field{margin-bottom:14px}.field>label,.small-label{display:block;color:var(--soft);font-size:11px;font-weight:600;text-transform:uppercase;margin-bottom:5px}.field input[type=text],.field select,.field textarea{width:100%}textarea{min-height:72px;resize:vertical}.pill-select{display:flex;flex-wrap:wrap;gap:5px}.pill-select label{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;cursor:pointer}.pill-select label.checked{background:var(--vine);color:white}.pill-select input{display:none}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabbar{display:flex;border-bottom:1px solid var(--line);padding:0 20px}.tabbar button{border:0;background:transparent;padding:11px 3px;margin-right:18px;color:var(--soft);cursor:pointer}.tabbar button.active{color:var(--vine2);border-bottom:2px solid var(--vine)}.list-row{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.list-row input{flex:1}.proj-card{border:1px solid var(--line);padding:11px;margin-bottom:9px}.proj-row{display:flex;gap:8px;align-items:center}.proj-row input{flex:1}.proj-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.inactive{opacity:.5}.login{min-height:100% <script>
(function(){'use strict';
const SUPABASE_URL='https://gnguhrinxurtxijqmkka.supabase.co';
const SUPABASE_KEY='sb_publishable_Rlye-noKBlyoIj94qP894g_dCLoK6A8';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DOW=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'], DOWS=['dom','lun','mar','mié','jue','vie','sáb'];
const TODAY=new Date();
const state={user:null,role:null,projects:[],personas:[],vehiculos:[],entries:{},vacaciones:{},hidden:{},showVac:true,year:TODAY.getFullYear(),month:TODAY.getMonth(),channels:[]};
const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c];});}
const pad=n=>n<10?'0'+n:''+n; const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const find=(a,id)=>a.find(x=>x.id===id); const canEdit=()=>state.role==='admin'||state.role==='editor'; const isAdmin=()=>state.role==='admin';
function colorForProject(id){let h=0;for(let c of id)h=(h*31+c.charCodeAt(0))>>>0;return `hsl(${h%360},42%,45%)`}
function days(month,year){let a=[],d=new Date(year,month,1);while(d.getMonth()===month){a.push(new Date(d));d.setDate(d.getDate()+1)}return a}
function dbOrder(o){return {id:o.id,nombre:o.nombre,proyecto:o.proyecto||'',responsable:o.responsable||'',ubicacion:o.ubicacion||'',order:o.orden??0,activo:o.activo!==false}}
function simpleOrder(o){return {id:o.id,nombre:o.nombre,order:o.orden??0,activo:o.activo!==false}}
async function signIn(){await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://antonioyeves.github.io/calendario-campo-2026/'}})}
async function logout(){for(const c of state.channels)sb.removeChannel(c);await sb.auth.signOut();location.reload()}
async function authorize(session){if(!session){showLogin();return false}state.user=session.user;const {data,error}=await sb.from('authorized_users').select('email,role').eq('email',session.user.email).maybeSingle();if(error||!data){await sb.auth.signOut();showLogin('La cuenta '+session.user.email+' no está autorizada.');return false}state.role=data.role;return true}
function showLogin(msg=''){$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');$('loginMsg').textContent=msg}
function showApp(){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('userBadge').textContent=state.user.email+' · '+state.role;$('btnConfig').classList.toggle('hidden',!isAdmin())}
async function loadAll(){
 const y=state.year, start=`${y}-01-01`,end=`${y}-12-31`;
 const [p,pe,v,e,va]=await Promise.all([
 sb.from('projects').select('*').order('orden'), sb.from('personas').select('*').order('orden'), sb.from('vehiculos').select('*').order('orden'),
 sb.from('entries').select('*').gte('fecha',start).lte('fecha',end), sb.from('vacaciones').select('*').gte('fecha',start).lte('fecha',end)]);
 for(const r of [p,pe,v,e,va])if(r.error)throw r.error;
 state.projects=p.data.map(dbOrder);state.personas=pe.data.map(simpleOrder);state.vehiculos=v.data.map(simpleOrder);state.entries={};state.vacaciones={};
 e.data.forEach(x=>state.entries[x.id]=x);va.data.forEach(x=>state.vacaciones[x.id]=x);renderAll();
}
function subscribe(){['projects','personas','vehiculos','entries','vacaciones'].forEach(t=>{let c=sb.channel('live-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},()=>loadAll()).subscribe();state.channels.push(c)})}
function renderAll(){renderYear();renderMonths();renderChips();renderGrid();}
function renderYear(){$('yearLabel').textContent=state.year}
function renderMonths(){let w=$('months');w.innerHTML='';MESES.forEach((n,i)=>{let b=document.createElement('button');b.className='month-btn'+(i===state.month?' active':'');b.textContent=n;b.onclick=()=>{state.month=i;renderMonths();renderGrid()};w.appendChild(b)})}
function activeProjects(){return state.projects.filter(p=>p.activo!==false&&!state.hidden[p.id])} function activePeople(){return state.personas.filter(p=>p.activo!==false)} function activeVehicles(){return state.vehiculos.filter(v=>v.activo!==false)}
function renderChips(){let w=$('chiprow');w.innerHTML='';let ps=state.projects.filter(p=>p.activo!==false);let all=document.createElement('button');all.className='link-btn';let any=ps.some(p=>state.hidden[p.id]);all.textContent=any?'Mostrar todos los proyectos':'Ocultar todos los proyectos';all.onclick=()=>{if(any)state.hidden={};else ps.forEach(p=>state.hidden[p.id]=true);renderChips();renderGrid()};w.appendChild(all);ps.forEach(p=>{let s=document.createElement('span');s.className='chip'+(state.hidden[p.id]?' off':'');let d=document.createElement('span');d.className='dot';d.style.background=colorForProject(p.id);let b=document.createElement('button');b.textContent=p.nombre;b.onclick=()=>{state.hidden[p.id]=!state.hidden[p.id];renderChips();renderGrid()};s.append(d,b);w.appendChild(s)})}
function renderEntry(btn,e){btn.innerHTML='';if(!e){btn.innerHTML='<span class="plus">+ añadir</span>';return}if(e.descripcion){let d=document.createElement('div');d.className='desc';d.textContent=e.descripcion;btn.appendChild(d)}let t=document.createElement('div');t.className='tags';if(e.estado==='realizada')t.innerHTML+='<span class="tag realizada">realizada</span>';if(e.estado==='cancelada')t.innerHTML+='<span class="tag cancelada">cancelada</span>';if(e.fecha_tipo==='aproximada')t.innerHTML+='<span class="tag aproximada">fecha aprox.</span>';if((e.personas||[]).length){let names=e.personas.map(id=>find(state.personas,id)?.nombre).filter(Boolean);t.innerHTML+=`<span class="tag">${esc(names.length===1?names[0]:names.length+' personas')}</span>`}if(e.vehiculo){let v=find(state.vehiculos,e.vehiculo);if(v)t.innerHTML+=`<span class="tag veh">${esc(v.nombre)}</span>`}btn.appendChild(t)}
function renderGrid(){
  let w=$('gridWrap');
  let ps=activeProjects();
  let people=activePeople();
  let showVac=state.showVac && people.length;
  let table=document.createElement('table'); table.className='cal';
  let thead=document.createElement('thead');
  let group=document.createElement('tr');
  let corner=document.createElement('th'); corner.className='corner'; corner.textContent=MESES[state.month]+' '+state.year; group.appendChild(corner);
  if(ps.length){let x=document.createElement('th');x.colSpan=ps.length;x.textContent='Proyectos en marcha';group.appendChild(x);}
  if(showVac){let x=document.createElement('th');x.colSpan=people.length;x.textContent='Vacaciones';group.appendChild(x);}
  thead.appendChild(group);
  let detail=document.createElement('tr'); detail.className='detail';
  let blank=document.createElement('th'); blank.className='corner'; blank.textContent=''; detail.appendChild(blank);
  ps.forEach(function(p){
    let x=document.createElement('th');
    x.innerHTML=`<span class="bar" style="background:${colorForProject(p.id)}"></span><span class="pname">${esc(p.nombre)}</span>${p.proyecto?'<span class="pline proy">'+esc(p.proyecto)+'</span>':''}${p.responsable?'<span class="pline">'+esc(p.responsable)+'</span>':''}${p.ubicacion?'<span class="pline">'+esc(p.ubicacion)+'</span>':''}`;
    detail.appendChild(x);
  });
  if(showVac){people.forEach(function(p){let x=document.createElement('th');x.className='vac-th';x.innerHTML=`<span class="pname">${esc(p.nombre)}</span><span class="pline">Vacaciones</span>`;detail.appendChild(x);});}
  thead.appendChild(detail); table.appendChild(thead);
  let body=document.createElement('tbody');
  days(state.month,state.year).forEach(function(d){
    let key=dk(d); let tr=document.createElement('tr');
    if(d.getDay()===0||d.getDay()===6)tr.classList.add('weekend');
    if(key===dk(TODAY))tr.classList.add('today');
    let rh=document.createElement('th'); rh.innerHTML=d.getDate()+' '+MESES[state.month].slice(0,3).toLowerCase()+`<span class="dow">${DOWS[d.getDay()]}</span>`; tr.appendChild(rh);
    ps.forEach(function(p){let td=document.createElement('td');let b=document.createElement('button');b.className='cell-btn';renderEntry(b,state.entries[p.id+'__'+key]);b.onclick=function(){openEntry(p,d,key)};if(!canEdit())b.title='Solo lectura';td.appendChild(b);tr.appendChild(td);});
    if(showVac){people.forEach(function(p){let td=document.createElement('td');td.className='vac-td';let b=document.createElement('button');b.className='cell-btn';let v=state.vacaciones[p.id+'__'+key];b.innerHTML=v&&v.activo?'<span class="tag vac">Vacaciones</span>'+(v.nota?'<div class="desc">'+esc(v.nota)+'</div>':''):'<span class="plus">+</span>';b.onclick=function(){openVacation(p,d,key)};td.appendChild(b);tr.appendChild(td);});}
    body.appendChild(tr);
  });
  table.appendChild(body); w.innerHTML=''; w.appendChild(table);
}
function modal(title,meta){let root=$('modalRoot'),ov=document.createElement('div');ov.className='overlay';let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-head"><div><h2>${esc(title)}</h2><div class="meta">${esc(meta||'')}</div></div><button class="modal-close">×</button></div><div class="modal-body"></div><div class="modal-foot"></div>`;ov.appendChild(m);root.appendChild(ov);let close=()=>ov.remove();m.querySelector('.modal-close').onclick=close;ov.onclick=e=>{if(e.target===ov)close()};return {ov,m,body:m.querySelector('.modal-body'),foot:m.querySelector('.modal-foot'),close}}
async function saveEntry(key,pid,date,data){let payload={id:key,project_id:pid,fecha:date,descripcion:data.descripcion,personas:data.personas,material:data.material,vehiculo:data.vehiculo,estado:data.estado,fecha_tipo:data.fecha_tipo,referencia_historica:false,origen:'web',observaciones:data.observaciones||'',updated_at:new Date().toISOString()};let {error}=await sb.from('entries').upsert(payload);if(error)alert(error.message);else await loadAll()}
async function deleteEntry(key){let {error}=await sb.from('entries').delete().eq('id',key);if(error)alert(error.message);else await loadAll()}
function openEntry(p,d,date){let key=p.id+'__'+date,e=state.entries[key]||{},x=modal(p.nombre,DOW[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()].toLowerCase()+' de '+d.getFullYear());let draft={descripcion:e.descripcion||'',personas:[...(e.personas||[])],material:e.material||'',vehiculo:e.vehiculo||'',estado:e.estado||'planificada',fecha_tipo:e.fecha_tipo||'confirmada',observaciones:e.observaciones||''};x.body.innerHTML=`<div class="field"><label>Qué se va a hacer</label><textarea id="edDesc"></textarea></div><div class="field"><label>Quién va</label><div id="edPeople" class="pill-select"></div></div><div class="field"><label>Material necesario</label><input id="edMat" type="text"></div><div class="field"><label>Vehículo</label><select id="edVeh"><option value="">— Ninguno —</option></select></div><div class="twocol"><div class="field"><label>Estado</label><select id="edEstado"><option value="planificada">Planificada</option><option value="realizada">Realizada</option><option value="cancelada">Cancelada</option></select></div><div class="field"><label>Fecha</label><select id="edFecha"><option value="confirmada">Confirmada</option><option value="aproximada">Aproximada</option></select></div></div><div class="field"><label>Observaciones</label><input id="edObs" type="text"></div>`;let q=s=>x.body.querySelector(s);q('#edDesc').value=draft.descripcion;q('#edMat').value=draft.material;q('#edObs').value=draft.observaciones;q('#edEstado').value=draft.estado;q('#edFecha').value=draft.fecha_tipo;activeVehicles().forEach(v=>{let o=document.createElement('option');o.value=v.id;o.textContent=v.nombre;if(v.id===draft.vehiculo)o.selected=true;q('#edVeh').appendChild(o)});activePeople().forEach(per=>{let l=document.createElement('label');let cb=document.createElement('input');cb.type='checkbox';cb.checked=draft.personas.includes(per.id);if(cb.checked)l.classList.add('checked');cb.onchange=()=>{if(cb.checked&&!draft.personas.includes(per.id))draft.personas.push(per.id);if(!cb.checked)draft.personas=draft.personas.filter(z=>z!==per.id);l.classList.toggle('checked',cb.checked)};l.append(cb,document.createTextNode(per.nombre));q('#edPeople').appendChild(l)});if(!canEdit()){x.body.querySelectorAll('input,textarea,select').forEach(z=>z.disabled=true);x.foot.innerHTML='<button class="btn" id="closeOnly">Cerrar</button>';x.foot.querySelector('#closeOnly').onclick=x.close;return}let del=document.createElement('button');del.className='btn danger';del.textContent='Borrar';del.onclick=async()=>{await deleteEntry(key);x.close()};let save=document.createElement('button');save.className='btn primary';save.textContent='Guardar';save.onclick=async()=>{draft.descripcion=q('#edDesc').value.trim();draft.material=q('#edMat').value.trim();draft.vehiculo=q('#edVeh').value;draft.estado=q('#edEstado').value;draft.fecha_tipo=q('#edFecha').value;draft.observaciones=q('#edObs').value.trim();if(draft.descripcion||draft.personas.length||draft.material||draft.vehiculo)await saveEntry(key,p.id,date,draft);else await deleteEntry(key);x.close()};x.foot.append(del,save)}
async function saveVac(key,pid,date,activo,nota){if(!activo&&!nota){await sb.from('vacaciones').delete().eq('id',key)}else{await sb.from('vacaciones').upsert({id:key,persona_id:pid,fecha:date,activo,nota,updated_at:new Date().toISOString()})}await loadAll()}
function openVacation(p,d,date){let key=p.id+'__'+date,v=state.vacaciones[key]||{},x=modal('Vacaciones · '+p.nombre,DOW[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()].toLowerCase()+' de '+d.getFullYear());x.body.innerHTML=`<div class="field"><label><input id="vacOn" type="checkbox"> De vacaciones este día</label></div><div class="field"><label>Nota opcional</label><input id="vacNote" type="text"></div>`;let a=x.body.querySelector('#vacOn'),n=x.body.querySelector('#vacNote');a.checked=!!v.activo;n.value=v.nota||'';if(!canEdit()){a.disabled=n.disabled=true;x.foot.innerHTML='<button class="btn" id="c">Cerrar</button>';x.foot.querySelector('#c').onclick=x.close;return}let s=document.createElement('button');s.className='btn primary';s.textContent='Guardar';s.onclick=async()=>{await saveVac(key,p.id,date,a.checked,n.value.trim());x.close()};x.foot.appendChild(s)}
async function saveItem(table,item){let payload={...item,orden:item.order};delete payload.order;let {error}=await sb.from(table).upsert(payload);if(error)alert(error.message);else await loadAll()}
function nextOrder(a){return Math.max(-1,...a.map(x=>x.order||0))+1}function newid(prefix){return prefix+'_'+Date.now().toString(36)+Math.floor(Math.random()*999)}
function openConfig(){if(!isAdmin())return;let x=modal('Proyectos, personas y vehículos','Administración. En lugar de borrar históricos, archiva los elementos que ya no estén activos.');x.m.classList.add('wide');let tabs=document.createElement('div');tabs.className='tabbar';x.m.insertBefore(tabs,x.body);let active='Proyectos';['Proyectos','Personas','Vehículos'].forEach(t=>{let b=document.createElement('button');b.textContent=t;b.className=t===active?'active':'';b.onclick=()=>{active=t;[...tabs.children].forEach(z=>z.classList.toggle('active',z===b));draw()};tabs.appendChild(b)});x.foot.innerHTML='<button class="btn" id="cfgClose">Cerrar</button>';x.foot.querySelector('#cfgClose').onclick=x.close;function draw(){x.body.innerHTML='';if(active==='Proyectos'){state.projects.forEach(p=>{let c=document.createElement('div');c.className='proj-card'+(p.activo===false?' inactive':'');c.innerHTML=`<div class="proj-row"><input class="pn" type="text"><button class="btn small toggle">${p.activo===false?'Reactivar':'Archivar'}</button></div><div class="proj-fields"><div><span class="small-label">Proyecto marco</span><input class="pp" type="text"></div><div><span class="small-label">Responsable</span><input class="pr" type="text"></div><div><span class="small-label">Ubicación</span><input class="pu" type="text"></div></div>`;for(let [sel,k] of [['.pn','nombre'],['.pp','proyecto'],['.pr','responsable'],['.pu','ubicacion']]){let i=c.querySelector(sel);i.value=p[k]||'';i.onchange=()=>{p[k]=i.value.trim();saveItem('projects',p)}}c.querySelector('.toggle').onclick=()=>{p.activo=p.activo===false;saveItem('projects',p)};x.body.appendChild(c)});let a=document.createElement('div');a.className='proj-row';a.innerHTML='<input type="text" placeholder="Nombre del nuevo proyecto"><button class="btn primary">Añadir proyecto</button>';a.querySelector('button').onclick=()=>{let n=a.querySelector('input').value.trim();if(n)saveItem('projects',{id:newid('p'),nombre:n,proyecto:'',responsable:'',ubicacion:'',activo:true,order:nextOrder(state.projects)})};x.body.appendChild(a)}else{let table=active==='Personas'?'personas':'vehiculos',list=table==='personas'?state.personas:state.vehiculos,label=table==='personas'?'persona':'vehículo';list.forEach(it=>{let r=document.createElement('div');r.className='list-row'+(it.activo===false?' inactive':'');r.innerHTML=`<input type="text"><button class="btn small">${it.activo===false?'Reactivar':'Archivar'}</button>`;let i=r.querySelector('input');i.value=it.nombre;i.onchange=()=>{it.nombre=i.value.trim()||it.nombre;saveItem(table,it)};r.querySelector('button').onclick=()=>{it.activo=it.activo===false;saveItem(table,it)};x.body.appendChild(r)});let a=document.createElement('div');a.className='list-row';a.innerHTML=`<input type="text" placeholder="Añadir ${label}…"><button class="btn primary">Añadir</button>`;a.querySelector('button').onclick=()=>{let n=a.querySelector('input').value.trim();if(n)saveItem(table,{id:newid(table==='personas'?'per':'veh'),nombre:n,activo:true,order:nextOrder(list)})};x.body.appendChild(a)}}draw()}
function search(term){term=term.trim().toLowerCase();let o=$('searchResults');if(!term){o.innerHTML='';return}let rows=Object.values(state.entries).filter(e=>{let names=(e.personas||[]).map(id=>find(state.personas,id)?.nombre||'').join(' '),veh=find(state.vehiculos,e.vehiculo)?.nombre||'';return [e.descripcion,e.material,e.observaciones,names,veh].join(' ').toLowerCase().includes(term)}).sort((a,b)=>a.fecha.localeCompare(b.fecha));o.innerHTML=rows.length?'<div class="meta" style="padding:8px 0">'+rows.slice(0,60).map(e=>`${esc(e.fecha)} · ${esc(find(state.projects,e.project_id)?.nombre||'')} · ${esc(e.descripcion)}`).join('<br>')+'</div>':'<div class="meta" style="padding:8px 0">Sin resultados.</div>'}
$('btnGoogle').onclick=signIn;$('btnLogout').onclick=logout;$('btnConfig').onclick=openConfig;$('search').oninput=e=>search(e.target.value);$('btnToggleVac').onclick=()=>{state.showVac=!state.showVac;$('btnToggleVac').textContent=state.showVac?'Ocultar columnas de vacaciones':'Mostrar columnas de vacaciones';renderGrid()};$('prevYear').onclick=async()=>{state.year--;await loadAll()};$('nextYear').onclick=async()=>{state.year++;await loadAll()};$('thisYear').onclick=async()=>{state.year=TODAY.getFullYear();state.month=TODAY.getMonth();await loadAll()};
async function boot(){try{const {data:{session}}=await sb.auth.getSession();if(!(await authorize(session)))return;showApp();await loadAll();subscribe()}catch(err){showLogin('Error al iniciar la aplicación: '+err.message)}}
sb.auth.onAuthStateChange((_event,session)=>{if(!session)showLogin()});boot();
})();
</script>
