(function(){'use strict';
const SUPABASE_URL='https://gnguhrinxurtxijqmkka.supabase.co';const SUPABASE_KEY='sb_publishable_Rlye-noKBlyoIj94qP894g_dCLoK6A8';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];const DOW=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],DOWS=['dom','lun','mar','mié','jue','vie','sáb'];const TODAY=new Date();const state={user:null,role:null,personaId:null,projects:[],personas:[],vehiculos:[],users:[],entries:{},vacaciones:{},hidden:{},year:TODAY.getFullYear(),month:TODAY.getMonth(),channels:[]};const $=id=>document.getElementById(id);function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}const pad=n=>n<10?'0'+n:''+n,dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),find=(a,id)=>a.find(x=>x.id===id),canEdit=()=>state.role==='admin'||state.role==='editor',isAdmin=()=>state.role==='admin';function days(m,y){let a=[],d=new Date(y,m,1);while(d.getMonth()===m){a.push(new Date(d));d.setDate(d.getDate()+1)}return a}function colorForProject(id){let h=0;for(let c of id)h=(h*31+c.charCodeAt(0))>>>0;return `hsl(${h%360},42%,45%)`}function dbProject(o){return{id:o.id,nombre:o.nombre,proyecto:o.proyecto||'',responsable:o.responsable||'',ubicacion:o.ubicacion||'',order:o.orden??0}}function dbSimple(o){return{id:o.id,nombre:o.nombre,order:o.orden??0}}

async function saveEntry(key,pid,date,d){let{error}=await sb.from('entries').upsert({id:key,project_id:pid,fecha:date,descripcion:d.descripcion,personas:d.personas,material:d.material,vehiculo:d.vehiculo,estado:d.estado,fecha_tipo:d.fecha_tipo,referencia_historica:false,origen:'web',observaciones:d.observaciones||'',updated_at:new Date().toISOString()});if(error)alert(error.message);else await loadAll()}async function deleteEntry(key){let{error}=await sb.from('entries').delete().eq('id',key);if(error)alert(error.message);else await loadAll()}

des(per.id))alert('Aviso: '+per.nombre+' está de vacaciones este día. Puedes asignar a la persona igualmente.');if(cb.checked&&!draft.personas.includes(per.id))draft.personas.push(per.id);if(!cb.checked)draft.personas=draft.personas.filter(z=>z!==per.id);l.classList.toggle('checked',cb.checked)};l.append(cb,document.createTextNode(per.nombre+(vac?.activo?' · 🏖 vacaciones':'')));q('#edPeople').appendChild(l)});if(!canEdit()){x.body.querySelectorAll('input,textarea,select').forEach(z=>z.disabled=true);x.foot.innerHTML='<button class="btn">Cerrar</button>';x.foot.firstChild.onclick=x.close;return}let del=document.createElement('button');del.className='btn danger';del.textContent='Borrar';del.onclick=async()=>{await deleteEntry(key);x.close()};let save=document.createElement('button');save.className='btn primary';save.textContent='Guardar';save.onclick=async()=>{draft.descripcion=q('#edDesc').value.trim();draft.material=q('#edMat').value.trim();draft.vehiculo=q('#edVeh').value;draft.estado=q('#edEstado').value;draft.fecha_tipo=q('#edFecha').value;draft.observaciones=q('#edObs').value.trim();if(draft.descripcion||draft.personas.length||draft.material||draft.vehiculo)await saveEntry(key,p.id,date,draft);else await deleteEntry(key);x.close()};x.foot.append(del,save)}
async function saveVac(key,pid,date,on,note=''){let r;if(!on&&!note)r=await sb.from('vacaciones').delete().eq('id',key);else r=await sb.from('vacaciones').upsert({id:key,persona_id:pid,fecha:date,activo:on,nota:note,updated_at:new Date().toISOString()});if(r.error)alert(r.error.message);else await loadAll()}
function openVacations(){let x=modal('Vacaciones',MESES[state.month]+' '+state.year+' · marca los días de ausencia.');x.m.classList.add('wide');x.body.innerHTML=`<div class="twocol"><div class="field"><label>Mes</label><select id="vm">${MESES.map((m,i)=>`<option value="${i}" ${i===state.month?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label>Persona</label><select id="vp"><option value="">Todas</option>${state.personas.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></div></div><div id="vl"></div>`;let vm=x.body.querySelector('#vm'),vp=x.body.querySelector('#vp'),vl=x.body.querySelector('#vl');function draw(){vl.innerHTML='';let ppl=vp.value?state.personas.filter(p=>p.id===vp.value):state.personas;days(+vm.value,state.year).forEach(d=>{let date=dk(d),r=document.createElement('div');r.className='vac-day';r.innerHTML=`<strong>${d.getDate()} ${MESES[+vm.value].slice(0,3).toLowerCase()}<span class="dow">${DOWS[d.getDay()]}</span></strong><div></div>`;let box=r.lastChild;ppl.forEach(p=>{let key=p.id+'__'+date,v=state.vacaciones[key],l=document.createElement('label'),cb=document.createElement('input');l.className='vac-person';cb.type='checkbox';cb.checked=!!v?.activo;cb.disabled=!canEdit();cb.onchange=async()=>{await saveVac(key,p.id,date,cb.checked,v?.nota||'');draw()};l.append(cb,document.createTextNode(p.nombre));box.appendChild(l)});vl.appendChild(r)})}vm.onchange=draw;vp.onchange=draw;draw();x.foot.innerHTML='<button class="btn">Cerrar</button>';x.foot.firstChild.onclick=x.close}
function nextOrder(a){return Math.max(-1,...a.map(x=>x.order||0))+1}function newid(p){return p+'_'+Date.now().toString(36)+Math.floor(Math.random()*999)}async function saveItem(table,item){let payload={...item,orden:item.order};delete payload.order;let{error}=await sb.from(table).upsert(payload);if(error)alert(error.message);else await loadAll()}async function removeItem(table,item){if(!confirm('¿Eliminar '+item.nombre+'?'))return;if(table==='personas'){let{data:u}=await sb.from('authorized_users').select('email').eq('persona_id',item.id);if(u?.length){alert('Esta persona está vinculada a un usuario. Revoca o cambia primero ese usuario.');return}}let{error}=await sb.from(table).delete().eq('id',item.id);if(error)alert('No se puede eliminar: '+error.message);else await loadAll()}async function saveUser(email,persona,role){let{error}=await sb.from('authorized_users').upsert({email:email.trim().toLowerCase(),persona_id:persona||null,role});if(error)alert(error.message);else await loadAll()}async function removeUser(email){if(!confirm('¿Revocar el acceso de '+email+'?'))return;let{error}=await sb.from('authorized_users').delete().eq('email',email);if(error)alert(error.message);else await loadAll()}
function openConfig(){if(!isAdmin())return;let x=modal('Proyectos, personas, vehículos y usuarios','Administración del calendario y accesos.');x.m.classList.add('wide');let tabs=document.createElement('div');tabs.className='tabbar';x.m.insertBefore(tabs,x.body);let active='Proyectos';['Proyectos','Personas','Vehículos','Usuarios'].forEach(t=>{let b=document.createElement('button');b.textContent=t;b.className=t===active?'active':'';b.onclick=()=>{active=t;[...tabs.children].forEach(z=>z.classList.toggle('active',z===b));draw()};tabs.appendChild(b)});function draw(){x.body.innerHTML='';if(active==='Proyectos'){state.projects.forEach(p=>{let c=document.createElement('div');c.className='proj-card';c.innerHTML=`<div class="proj-row"><input class="pn" type="text"><button class="btn danger small">Eliminar</button></div><div class="proj-fields"><div><span class="small-label">Proyecto marco</span><input class="pp" type="text"></div><div><span class="small-label">Responsable</span><input class="pr" type="text"></div><div><span class="small-label">Ubicación</span><input class="pu" type="text"></div></div>`;[['.pn','nombre'],['.pp','proyecto'],['.pr','responsable'],['.pu','ubicacion']].forEach(([sel,k])=>{let i=c.querySelector(sel);i.value=p[k]||'';i.onchange=()=>{p[k]=i.value.trim();saveItem('projects',p)}});c.querySelector('button').onclick=()=>removeItem('projects',p);x.body.appendChild(c)});let a=document.createElement('div');a.className='proj-row';a.innerHTML='<input type="text" placeholder="Nombre del nuevo proyecto"><button class="btn primary">Añadir proyecto</button>';a.querySelector('button').onclick=()=>{let n=a.querySelector('input').value.trim();if(n)saveItem('projects',{id:newid('p'),nombre:n,proyecto:'',responsable:'',ubicacion:'',order:nextOrder(state.projects)})};x.body.appendChild(a);return}if(active==='Usuarios'){state.users.forEach(u=>{let r=document.createElement('div');r.className='user-row';r.innerHTML=`<select class="person"><option value="">Sin vincular</option>${state.personas.map(p=>`<option value="${p.id}" ${u.persona_id===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select><input class="mail" type="text" value="${esc(u.email)}" readonly><select class="role"><option value="admin">Administrador</option><option value="editor">Editor</option><option value="lector">Lector</option></select><button class="btn danger small">Revocar</button>`;r.querySelector('.role').value=u.role;r.querySelector('.person').onchange=()=>saveUser(u.email,r.querySelector('.person').value,r.querySelector('.role').value);r.querySelector('.role').onchange=()=>saveUser(u.email,r.querySelector('.person').value,r.querySelector('.role').value);r.querySelector('button').onclick=()=>removeUser(u.email);x.body.appendChild(r)});let a=document.createElement('div');a.className='user-row';a.innerHTML=`<select class="person"><option value="">Persona…</option>${state.personas.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select><input class="mail" type="text" placeholder="correo@gmail.com"><select class="role"><option value="editor">Editor</option><option value="lector">Lector</option><option value="admin">Administrador</option></select><button class="btn primary">Autorizar</button>`;a.querySelector('button').onclick=()=>{let mail=a.querySelector('.mail').value.trim();if(mail)saveUser(mail,a.querySelector('.person').value,a.querySelector('.role').value)};x.body.appendChild(a);return}let table=active==='Personas'?'personas':'vehiculos',list=table==='personas'?state.personas:state.vehiculos,label=table==='personas'?'persona':'vehículo';list.forEach(it=>{let r=document.createElement('div');r.className='list-row';r.innerHTML='<input type="text"><button class="btn danger small">Eliminar</button>';r.querySelector('input').value=it.nombre;r.querySelector('input').onchange=()=>{it.nombre=r.querySelector('input').value.trim()||it.nombre;saveItem(table,it)};r.querySelector('button').onclick=()=>removeItem(table,it);x.body.appendChild(r)});let a=document.createElement('div');a.className='list-row';a.innerHTML=`<input type="text" placeholder="Añadir ${label}…"><button class="btn primary">Añadir</button>`;a.querySelector('button').onclick=()=>{let n=a.querySelector('input').value.trim();if(n)saveItem(table,{id:newid(table==='personas'?'per':'veh'),nombre:n,order:nextOrder(list)})};x.body.appendChild(a)}draw();x.foot.innerHTML='<button class="btn">Cerrar</button>';x.foot.firstChild.onclick=x.close}
function search(term){term=term.trim().toLowerCase();let o=$('searchResults');if(!term){o.innerHTML='';return}let rows=Object.values(state.entries).filter(e=>[e.descripcion,e.material,e.observaciones].join(' ').toLowerCase().includes(term));o.innerHTML=rows.length?'<div class="meta" style="padding:8px 0">'+rows.slice(0,60).map(e=>`${esc(e.fecha)} · ${esc(find(state.projects,e.project_id)?.nombre||'')} · ${esc(e.descripcion)}`).join('<br>')+'</div>':'<div class="meta">Sin resultados.</div>'}
function subscribe(){['projects','personas','vehiculos','entries','vacaciones','authorized_users'].forEach(t=>state.channels.push(sb.channel('live-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},()=>loadAll()).subscribe()))}
$('btnGoogle').onclick=signIn;$('btnLogout').onclick=logout;$('btnConfig').onclick=openConfig;$('btnVacations').onclick=openVacations;$('search').oninput=e=>search(e.target.value);$('prevYear').onclick=async()=>{state.year--;await loadAll()};$('nextYear').onclick=async()=>{state.year++;await loadAll()};$('thisYear').onclick=async()=>{state.year=TODAY.getFullYear();state.month=TODAY.getMonth();await loadAll()};async function boot(){try{const{data:{session}}=await sb.auth.getSession();if(!(await authorize(session)))return;showApp();await loadAll();subscribe()}catch(err){showLogin('Error al iniciar la aplicación: '+err.message)}}sb.auth.onAuthStateChange((_e,s)=>{if(!s)showLogin()});boot();})();
